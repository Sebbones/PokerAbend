<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Spieleabend – Passwort</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='6' y='6' width='52' height='52' rx='13' fill='%23F7F3E8' stroke='%23C99A45' stroke-width='4'/><g fill='%23101a18'><circle cx='21' cy='21' r='5'/><circle cx='43' cy='21' r='5'/><circle cx='32' cy='32' r='5'/><circle cx='21' cy='43' r='5'/><circle cx='43' cy='43' r='5'/></g></svg>">
  <link rel="stylesheet" href="/style.css">
  <style>.lobby-alt{display:grid;margin-top:14px}.lobby-alt .btn{text-align:center;text-decoration:none}</style>
</head>
<body>
  <main class="lobby">
    <div class="lobby-felt">
      <h1 class="wordmark">Spieleabend</h1>
      <div id="login-language"></div>
      <p class="lobby-sub" data-i18n>Privater Tisch. Gib das Passwort ein, das ihr in der Gruppe ausgemacht habt. Dein Browser merkt es sich danach.</p>
      <form class="lobby-form" method="post" action="/login">
        <input type="hidden" name="next" value="{{NEXT}}">
        <label class="field">
          <span data-i18n>Passwort</span>
          <input type="password" name="password" required autofocus autocomplete="current-password">
        </label>
        <button class="btn btn-brass btn-big" type="submit" data-i18n>Reinkommen</button>
        <p class="error" role="alert" data-i18n>{{ERROR}}</p>
      </form>
      {{DISCORD}}
    </div>
  </main>
  <script src="/i18n-en.js"></script>
  <script src="/discord-en.js"></script>
  <script src="/i18n.js"></script>
  <script src="/login.js"></script>
</body>
</html>
