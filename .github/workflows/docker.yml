name: Docker-Image

# Bei Push: schnelle Tests + kleine Browser-Rauchprobe, erst bei Grün wird das Image gebaut.
# Nachts: alle Tests und alle Browser-Prüfungen (ohne Image), Bericht als Artefakt.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read
  packages: write

jobs:
  fast:
    name: Schnelle Tests und Rauchprobe
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Schnelle Tests (ohne Simulationen und Langläufer)
        run: npm run test:fast

      - name: Browser für die Rauchprobe installieren
        run: npx playwright install --with-deps chromium

      - name: Rauchprobe (Startseite, Kartenspiel, Brettspiel, Handy-Ansicht)
        run: npm run test:smoke
        env:
          PLAYWRIGHT_CHANNEL: chromium

      - name: Bericht bei Fehlern sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rauchprobe-fehler
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Image bauen und veröffentlichen
    needs: fast
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v7

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker-Image bauen und veröffentlichen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/ttlpscwa/pokerabend:latest
          # Commit-Hash ins Image: sichtbar unter „Ich“ und auf /health
          build-args: |
            GIT_COMMIT=${{ github.sha }}

  nightly:
    name: Nächtlicher Volllauf
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Alle Node-Tests (inklusive Simulationen)
        id: node
        continue-on-error: true
        run: |
          mkdir -p reports
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=reports/node-tests.xml "test/*.test.js"

      - name: Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Alle Playwright-Prüfungen
        id: ui
        continue-on-error: true
        # Ein Wiederholungsversuch fängt einzelne Wackler ab; Wackler bleiben im HTML-Bericht als "flaky" sichtbar.
        run: npx playwright test --retries=1 --reporter=list,html,junit,json
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: reports/playwright.xml
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/playwright.json

      - name: Wackelige Tests in der Zusammenfassung ausweisen
        if: always()
        run: |
          node -e "
          const fs=require('fs');if(!fs.existsSync('reports/playwright.json'))process.exit(0);
          const flaky=[];(function walk(s){for(const x of s.suites||[])walk(x);for(const sp of s.specs||[])for(const t of sp.tests||[])if(t.status==='flaky')flaky.push(t.projectName+' › '+sp.file+':'+sp.line+' › '+sp.title);})({suites:JSON.parse(fs.readFileSync('reports/playwright.json')).suites});
          const out='### Wackelige Playwright-Tests (erst im Wiederholungsversuch grün): '+flaky.length+'\n'+flaky.map(x=>'- '+x).join('\n')+'\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,out);"

      - name: Bericht als Artefakt speichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nachtlauf-bericht
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Ergebnis prüfen
        if: steps.node.outcome == 'failure' || steps.ui.outcome == 'failure'
        run: |
          echo "Node-Tests: ${{ steps.node.outcome }}, Playwright: ${{ steps.ui.outcome }}"
          exit 1
